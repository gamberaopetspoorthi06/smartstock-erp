version: '3.8'

# SmartStock ERP - Docker Compose
# Builds and serves the React frontend via Nginx

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartstock-erp
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
